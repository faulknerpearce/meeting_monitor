name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Lint
        run: make lint

      - name: Format
        run: make format

      - name: Test
        run: make test
