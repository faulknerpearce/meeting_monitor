name: MeetingMonitor
options:
  bundleIdPrefix: com.meetingmonitor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  MeetingMonitor:
    type: application
    platform: macOS
    sources:
      - path: MeetingMonitor
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingmonitor.app
        PRODUCT_NAME: Meeting Monitor
        PRODUCT_MODULE_NAME: MeetingMonitor
        INFOPLIST_FILE: MeetingMonitor/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingMonitor/Resources/MeetingMonitor.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    entitlements:
      path: MeetingMonitor/Resources/MeetingMonitor.entitlements
  MeetingMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeetingMonitorTests
    dependencies:
      - target: MeetingMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingmonitor.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Meeting Monitor.app/Contents/MacOS/Meeting Monitor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_TESTING_SEARCH_PATHS: YES
schemes:
  MeetingMonitor:
    build:
      targets:
        MeetingMonitor: all
        MeetingMonitorTests: [test]
    test:
      targets:
        - MeetingMonitorTests
    run:
      config: Debug
